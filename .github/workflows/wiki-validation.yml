name: Wiki validation
on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "Wiki/**"
      - "scripts/wiki_*.py"
      - "scripts/test_wiki_*.py"
      - ".github/workflows/wiki-*.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check Wiki references and metadata
        run: python scripts/wiki_validate.py
      - name: Test source-intake safety and determinism
        run: python -m unittest discover -s scripts -p 'test_wiki_*.py' -v
