logical?'업무 속성':'COLUMN'}</text><text x="${t.x+332}" y="${t.y+66}" font-size="11" style="fill:#9eb0c7">TYPE</text><text x="${t.x+430}" y="${t.y+66}" font-size="11">NULL</text>${t.cols.map((c,i)=>`<line class="rowline" x1="${t.x+10}" x2="${t.x+t.w-10}" y1="${t.y+84+i*20}" y2="${t.y+84+i*20}"/><text x="${t.x+12}" y="${t.y+80+i*20}" font-size="11" style="fill:${c.key.includes('PK')?'#f3d477':'#a9c9eb'}">${c.key.replace('UQ','UQ*')}</text><text x="${t.x+72}" y="${t.y+80+i*20}" font-size="14">${esc(logical?c.label:c.name)}</text><text x="${t.x+332}" y="${t.y+80+i*20}" font-size="12">${c.type}</text><text x="${t.x+436}" y="${t.y+80+i*20}" font-size="12" style="fill:${c.nullable?'#a2b0c4':'#e9f2fb'}">${c.nullable?'?':'NN'}</text>`).join('')}</g>`}).join('');svg.insertAdjacentHTML('beforeend',edges.map(e=>{let color=e.ident?'#63cfdb':'#dba6e0';return [[e.startPoint,e.startVector,e.optional?'0..1':'1'],[e.endPoint,e.endVector,'N']].map(([p,v,label])=>{let w=label==='0..1'?44:30,cx=p[0]+v[0]*(w/2+5),cy=p[1]+v[1]*17;return `<g class="endpoint" data-edge="${e.id}" role="button" tabindex="0" aria-label="R${e.id} ${by[e.to].label} N 대 ${by[e.from].label} ${e.optional?'0 또는 1':'1'} 관계"><rect x="${cx-w/2}" y="${cy-11}" width="${w}" height="22" rx="4" fill="#111821" stroke="${color}"/><text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="17" font-weight="bold" style="fill:${color}">${label}</text><title>R${e.id}: ${by[e.from].label} ${e.optional?'0..1':'1'} → ${by[e.to].label} N (0개 이상)</title></g>`}).join('')}).join(''));svg.querySelectorAll('.endpoint').forEach(n=>{n.onclick=()=>showEdge(+n.dataset.edge);n.onkeydown=e=>{if(e.key==='Enter')showEdge(+n.dataset.edge)}});svg.querySelectorAll('.card').forEach(n=>{n.onclick=()=>select(n.dataset.table);n.ondblclick=()=>showTable(n.dataset.table);n.onkeydown=e=>{if(e.key==='Enter')showTable(n.dataset.table)}});svg.querySelectorAll('.edge,.edge-hit,.endpoint').forEach(n=>{n.onclick=()=>showEdge(+n.dataset.edge);n.onmouseenter=()=>{svg.querySelectorAll('.edge,.endpoint').forEach(m=>{m.classList.toggle('active',m.dataset.edge===n.dataset.edge);m.classList.toggle('faded',m.dataset.edge!==n.dataset.edge)})};n.onmouseleave=()=>{if(selected)select(selected);else svg.querySelectorAll('.edge,.endpoint').forEach(m=>m.classList.remove('active','faded'))}});if(selected)select(selected)}
const uq={members:[['email'],['nickname']],roles:[['name']],tech_stacks:[['name']],recruitment_slots:[['slot_id','post_id'],['post_id','role_id']],comments:[['comment_id','post_id']]};
function select(name){selected=name;svg.querySelectorAll('.endpoint').forEach(n=>{let e=edges[+n.dataset.edge-1],on=e.from===name||e.to===name;n.classList.toggle('faded',!on);n.classList.toggle('active',on)});let linked=new Set([name]);edges.filter(e=>e.from===name||e.to===name).forEach(e=>{linked.add(e.from);linked.add(e.to)});svg.querySelectorAll('.card').forEach(n=>{n.classList.toggle('faded',!linked.has(n.dataset.table));n.classList.toggle('selected',n.dataset.table===name)});svg.querySelectorAll('.edge').forEach(n=>{let e=edges[+n.dataset.edge-1],on=e.from===name||e.to===name;n.classList.toggle('active',on);n.classList.toggle('faded',!on)});document.querySelector('#selection').textContent=by[name].label+' · '+name+' · '+edges.filter(e=>e.from===name||e.to===name).map(e=>'R'+e.id).join(', ');document.querySelector('#detail').hidden=false}
function reset(){selected=null;document.querySelector('#search').value='';svg.querySelectorAll('.faded,.active,.selected').forEach(n=>n.classList.remove('faded','active','selected'));document.querySelector('#detail').hidden=true;document.querySelector('#selection').textContent='테이블 선택: 연결 강조 · 더블클릭 또는 Enter: 상세 명세 · 휠: 확대 · 드래그: 이동 · Esc: 초기화'}
function modal(title,body){document.querySelector('#modalTitle').textContent=title;document.querySelector('#modalBody').innerHTML=body;document.querySelector('#modal').showModal()}
function relationRows(rs){return '<table><thead><tr><th>관계</th><th>참조 대상 (부모)</th><th>외래키 (자식)</th><th>카디널리티</th></tr></thead><tbody>'+rs.map(e=>`<tr><td>R${e.id}<br>${e.ident?'식별':'비식별'}</td><td><code>${e.from}<br>(${e.pk})</code></td><td><code>${e.to}<br>(${e.fk})</code></td><td>${e.optional?'0..1':'1'} → 0..N</td></tr>`).join('')+'</tbody></table>'}
function tableNotes(t){let a=[];if(t==='recruitment_slots')a.push('복합 FK 참조를 위해 UNIQUE(slot_id, post_id)가 필요합니다. UNIQUE(post_id, role_id)는 한 모집글의 동일 역할 중복 방지를 위한 권고안입니다.','정원은 capacity > 0을 CHECK로 제한하고, 승인 시 slot 행 잠금 후 승인 인원과 capacity를 비교하세요.');if(t==='comments')a.push('복합 FK (parent_comment_id, post_id)는 같은 모집글의 부모 댓글만 허용합니다. UNIQUE(comment_id, post_id)가 필요합니다.','parent_comment_id가 NULL이면 루트 댓글입니다. 자기 참조와 순환, 허용 댓글 깊이는 서비스에서 검사해야 합니다.','삭제 시 내용만 지우고 부모 행을 유지하는 방식을 권고합니다. content NULL과 is_content_removed의 일관성 정책을 확정하세요.');if(t==='applications')a.push('복합 FK (slot_id, post_id)는 다른 모집글의 모집 역할에 지원하는 오류를 막습니다. 두 컬럼의 순서를 유지하세요.','decided_by_member_id는 NULL 허용입니다. 처리자가 모집글 작성자인지는 FK로 보장되지 않으므로 권한 검증이 필요합니다.','중복 지원 방지 UNIQUE(post_id, applicant_member_id)는 재지원 정책 확정 후 추가하세요.','github_url_snapshot, portfolio_url_snapshot은 제출 시점에 복사하고 이후 프로필 변경에 동기화하지 않는 것을 권고합니다.');if(t==='members')a.push('이메일·닉네임은 각각 단일 UNIQUE입니다. 대소문자 및 정규화 정책과 collation을 함께 확정하세요.','비밀번호는 단방향 적응형 해시로 저장하고 원문을 저장하지 마세요.');if(t==='recruitment_posts')a.push('type, work_mode, status, close_reason의 허용값이 원본에 없습니다. API enum, CHECK 및 상태 전이표를 함께 확정해야 합니다.','마감일의 종료 시각과 시간대, start_date와의 선후 조건, removed_at 기반 공개 필터를 명시하세요.');if(!a.length)a.push('PK와 FK를 아래와 같이 유지합니다. 기본값·삭제 정책·ID 생성 방식은 원본에 명시되지 않았습니다.');return '<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>'}
function showTable(name){let t=by[name],pk=t.cols.filter(c=>c.key.includes('PK')).map(c=>c.name);modal(t.label+' · '+name,`<p><span class="badge">원본: 컬럼 · 타입 · NULL · PK · 18개 FK 보존</span></p><p><b>PRIMARY KEY</b> <code>(${pk.join(', ')})</code></p>${uq[name]?`<p><b>UNIQUE</b> <code>${uq[name].map(a=>'('+a.join(', ')+')').join(' / ')}</code></p><small>단일 UQ는 원본 확인. 복합 참조키는 FK에서 도출. (post_id, role_id)는 권고안.</small>`:''}<table><thead><tr><th>키</th><th>컬럼</th><th>업무명</th><th>타입</th><th>NULL</th></tr></thead><tbody>${t.cols.map(c=>`<tr><td>${c.key}</td><td><code>${c.name}</code></td><td>${c.label}</td><td>${c.type}</td><td>${c.nullable?'허용':'불가'}</td></tr>`).join('')}</tbody></table><h3>연결된 FK</h3>${relationRows(edges.filter(e=>e.from===name||e.to===name))}<h3>구현 시 주의 / 권고</h3>${tableNotes(name)}`)}
function showEdge(id){let e=edges[id-1];modal('R'+id+' · '+(e.ident?'식별 관계':'비식별 관계'),`<div style="font-size:22px;padding:18px 0"><b>${by[e.to].label}</b> <span style="color:#f1b866">N</span> → <span style="color:#78b5fa">${e.optional?'0..1':'1'}</span> <b>${by[e.from].label}</b> <small>다대일</small></div><p>반대로 읽으면: <b>${by[e.from].label} 1행 → ${by[e.to].label} 여러 행</b> (일대다, 자식이 0개일 수도 있음)</p>`+relationRows([e])+`<pre>FOREIGN KEY (${e.fk})\nREFERENCES ${e.from} (${e.pk})</pre><p>자식 1행이 참조하는 부모는 ${e.optional?'0 또는 1':'정확히 1'}행입니다. 부모 1행은 자식 0개 이상을 가질 수 있습니다.</p><p>ON DELETE / ON UPDATE: 원본 미정. 구현 초안은 RESTRICT를 사용합니다.</p>`)}
function ddl(){let out=['-- DevPedia 구현 초안 / MySQL 8.0.16+ 가정','-- 원본 보존: 11 tables, 18 FK. 정책 확정 전 운영 적용 금지.','-- 가정: InnoDB, utf8mb4, RESTRICT. ID 및 시각은 애플리케이션에서 제공.','-- 미정: enum/check, default, ID 전략, 중복 지원/재지원, 삭제 및 collation 정책.'];for(let t of tables){let rows=t.cols.map(c=>'  '+c.name+' '+c.type+(c.nullable?' NULL':' NOT NULL'));rows.push('  PRIMARY KEY ('+t.cols.filter(c=>c.key.includes('PK')).map(c=>c.name).join(', ')+')');for(let [i,a] of (uq[t.name]||[]).entries())rows.push('  CONSTRAINT uq_'+t.name+'_'+(i+1)+' UNIQUE ('+a.join(', ')+')');out.push('CREATE TABLE '+t.name+' (\n'+rows.join(',\n')+'\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;')}for(let e of edges)out.push('ALTER TABLE '+e.to+' ADD CONSTRAINT fk_r'+String(e.id).padStart(2,'0')+' FOREIGN KEY ('+e.fk+') REFERENCES '+e.from+' ('+e.pk+') ON DELETE RESTRICT ON UPDATE RESTRICT;');out.push('-- 권고: capacity > 0, is_content_removed IN (0,1) CHECK; 업무 정책 확정 후 추가.');return out.join('\n\n')}
function showSpec(){modal('구현 명세 · 확인된 구조와 결정할 정책',`<div class="notice"><b>완성도 경계</b><br>원본의 11개 테이블·${tables.reduce((n,t)=>n+t.cols.length,0)}개 컬럼·18개 FK를 보존했습니다. 아래 SQL은 구조 구현 초안입니다. 원본에 없는 업무 규칙은 확정된 사실로 취급하지 않습니다. 이 ERD만으로 무조건 구현 완료를 보장할 수는 없습니다.</div><h3>01 · 키와 관계 읽기</h3><ul><li>여러 PK 컬럼은 각각의 PK가 아니라 하나의 복합 PK입니다. PK/FK는 부모 키가 자식 PK에 포함되는 식별 관계입니다.</li><li>UQ*는 UNIQUE 참여 표시입니다. 각 컬럼이 개별 유일하다는 뜻이 아닙니다. 테이블 상세의 묶음을 확인하세요.</li><li>지원서 (slot_id, post_id), 댓글 (parent_comment_id, post_id)는 분리하지 말고 복합 FK로 선언하세요.</li><li>관계선의 숫자는 테이블 단위 카디널리티입니다. 연결 위치는 컬럼 행과 일치하지 않으며 정확한 FK 컬럼은 선/숫자를 클릭해 확인합니다. 선 교차는 관계 결합을 의미하지 않습니다. 선을 선택하면 부모·자식 컬럼 순서를 확인할 수 있습니다.</li></ul><h3>02 · 확정이 필요한 정책</h3><table><tr><th>항목</th><th>원본 상태 / 구현 권고</th></tr><tr><td>DB / ID</td><td>DB 버전 및 ID 발급 방식 미정. 초안은 MySQL 8.0.16+, BIGINT, 앱 발급 가정. AUTO_INCREMENT 채택 시 PK마다 명시.</td></tr><tr><td>상태·유형</td><td>모집글 type / work_mode / status / close_reason, 지원서 status / auto_close_reason: 허용값·초기값·전이·전이 권한 확정 후 CHECK와 API enum 동기화.</td></tr><tr><td>기본값·시각</td><td>DEFAULT 원본 없음. created_at, updated_at, submitted_at 작성 주체 결정. UTC 저장 권고, DATE 마감은 업무 시간대 별도 정의.</td></tr><tr><td>삭제·개인정보</td><td>초안은 RESTRICT로 연쇄 삭제 방지. 탈퇴 시 개인정보 익명화·지원서 스냅샷 보존 기간·댓글 내용 제거·북마크 삭제 정책 확정.</td></tr><tr><td>중복</td><td>모집글 내 동일 역할 UNIQUE(post_id, role_id) 권고. 지원서는 중복·재지원 정책에 따라 UNIQUE(post_id, applicant_member_id) 여부 결정.</td></tr><tr><td>문자열</td><td>utf8mb4 가정. 이메일·닉네임 대소문자 비교와 공백 정규화, collation 확정. URL 형식과 길이 앱 검증.</td></tr></table><h3>03 · 트랜잭션과 권한</h3><ol><li>지원 생성: 로그인 회원 확인 → 모집글/slot 잠금 → 동일 모집글·진행 상태·마감·본인 글 지원 제한·중복 여부 검증 → 프로필 스냅샷 복사 → INSERT → COMMIT. 본인 지원 허용 여부는 정책 확정 필요.</li><li>지원 승인: 모집글 → slot → application 순서로 잠금 순서를 통일. 작성자 권한 및 현재 상태 검증 → 승인 인원 계산 → capacity 초과 차단 → 상태·decided_at·decided_by_member_id를 한 트랜잭션에서 수정. 동일 요청은 멱등 처리.</li><li>마감 처리: 지원 승인과 동일한 잠금 규약 적용. 마감 사유·closed_at과 대기 지원서 처리 정책을 원자적으로 반영.</li><li>댓글: 같은 모집글의 부모 참조는 복합 FK로 보장. 자기 참조·순환·깊이 제한은 추가 검사. 제거한 댓글의 자식 보존 정책 명시.</li></ol><h3>04 · 인덱스 권고 (조회 패턴 검증 후 적용)</h3><pre>recruitment_posts (status, created_at, post_id)
recruitment_posts (author_member_id, created_at, post_id)
applications (slot_id, status)
applications (applicant_member_id, submitted_at, application_id)

recruitment_post_tech_stacks (tech_stack_id, post_id)</pre><p>FK 인덱스와 중복되는 선두 컬럼을 점검하고 EXPLAIN으로 검증하세요. 목록은 OFFSET보다 (시각, ID) 커서 페이지네이션을 권고합니다.</p><h3>05 · 관계 사전</h3>${relationRows(edges)}<h3>06 · 구조 SQL 초안</h3><p>테이블을 모두 만든 뒤 FK를 추가하여 생성 순서와 자기 참조 문제를 피합니다. 복합 UQ 두 개는 참조 대상에서 도출한 명시적 키입니다. 모집글·역할 UQ는 권고로 포함했습니다.</p><button id="downloadSQL">SQL 초안 내려받기</button><pre>${esc(ddl())}</pre><h3>07 · 구현 검증 체크리스트</h3><ul><li>존재하지 않는 부모 ID, 다른 모집글의 slot·댓글 부모를 넣으면 실패하는가?</li><li>NULL 처리자·루트 댓글은 허용되고, 필수 FK의 NULL은 거부되는가?</li><li>동시 승인 시 정원이 넘지 않고, 재시도 시 중복 처리가 없는가?</li><li>이메일·닉네임·복합 PK 중복, 역할 중복 규칙을 DB가 보장하는가?</li><li>마감 직전 지원·승인 경합, 권한 없는 상태 변경, 댓글 순환을 차단하는가?</li><li>탈퇴·삭제 후 FK 무결성과 개인정보 보존/파기 규칙이 유지되는가?</li></ul>`);document.querySelector('#downloadSQL').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ddl()],{type:'text/plain;charset=utf-8'}));a.download='DevPedia_schema_draft.sql';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
function draw(){svg.setAttribute('viewBox',box.join(' '))}function zoom(f){let w=box[2]*f,h=box[3]*f;if(w<450||w>5000)return;box=[box[0]+(box[2]-w)/2,box[1]+(box[3]-h)/2,w,h];draw()}document.querySelector('#fit').onclick=()=>{box=[0,0,2360,1200];draw();reset()};document.querySelector('#plus').onclick=()=>zoom(.8);document.querySelector('#minus').onclick=()=>zoom(1.25);document.querySelector('#spec').onclick=showSpec;document.querySelector('#detail').onclick=()=>showTable(selected);document.querySelector('#close').onclick=()=>document.querySelector('#modal').close();document.querySelector('#mode').onchange=e=>{logical=e.target.value==='logical';render()};document.querySelector('#search').oninput=e=>{let q=e.target.value.toLowerCase().trim();if(!q){reset();return}let ts=tables.filter(t=>(t.name+t.label+t.cols.map(c=>c.name+c.label).join(' ')).toLowerCase().includes(q));if(ts.length===1)select(ts[0].name);else{svg.querySelectorAll('.card').forEach(n=>n.classList.toggle('faded',!ts.some(t=>t.name===n.dataset.table)));document.querySelector('#selection').textContent=ts.length+'개 테이블 일치: '+ts.map(t=>t.label).join(', ')}};
let drag;svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.1:.9)},{passive:false});svg.onpointerdown=e=>{if(e.target.closest('.card,.edge,.edge-hit,.endpoint'))return;drag=[e.clientX,e.clientY];svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;let r=svg.getBoundingClientRect(),scale=Math.max(box[2]/r.width,box[3]/r.height);box[0]-=(e.clientX-drag[0])*scale;box[1]-=(e.clientY-drag[1])*scale;drag=[e.clientX,e.clientY];draw()};svg.onpointerup=svg.onpointercancel=()=>drag=null;document.addEventListener('keydown',e=>{if(e.key==='Escape')reset()});render();window.__erd={tables,edges,ddl};
