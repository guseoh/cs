<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevPedia ERD 탐색</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font:15px 'Malgun Gothic',sans-serif;background:#f6f8fb;color:#16293d}header{padding:12px 20px;border-bottom:1px solid #8295aa;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:19px;margin:0 20px 0 0}button,a{font:inherit;color:inherit}button{padding:7px 12px;border:1px solid #8295aa;border-radius:4px;background:transparent;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #247da5}button[aria-pressed=true]{background:#d8e9f3}main{height:calc(100vh - 72px);overflow:auto}object{display:block;margin:0 auto;border:0}@media(prefers-color-scheme:dark){body{background:#192330;color:#f0f4fa}button[aria-pressed=true]{background:#34536e}}</style>
<header><h1>DevPedia ERD</h1><button id="physical" aria-pressed="true" onclick="show('물리')">물리 ERD</button><button id="logical" aria-pressed="false" onclick="show('논리')">논리 ERD</button><button onclick="fit()">전체 보기</button><button onclick="zoom(1.25)">확대</button><button onclick="zoom(.8)">축소</button><button onclick="size(dimensions[0])">원본 크기</button><a id="original" href="03_물리_ERD.svg" target="_blank" rel="noopener">원본 열기</a></header>
<main id="viewport"><object id="diagram" type="image/svg+xml" data="03_물리_ERD.svg" aria-label="DevPedia 물리 ERD"><a href="03_물리_ERD.svg">물리 ERD 열기</a></object></main>
<script>const diagram=document.getElementById('diagram'),viewport=document.getElementById('viewport');let dimensions=[2360,1410],fitted=true;function size(width){fitted=false;diagram.style.width=width+'px';diagram.style.height=width*dimensions[1]/dimensions[0]+'px'}function fit(){size(Math.min(viewport.clientWidth,viewport.clientHeight*dimensions[0]/dimensions[1]));fitted=true;viewport.scrollTo(0,0)}function zoom(factor){size(Math.max(600,Math.min(6000,diagram.getBoundingClientRect().width*factor)))}function show(mode){dimensions=mode==='물리'?[2360,1410]:[2920,2220];diagram.data='03_'+mode+'_ERD.svg';diagram.setAttribute('aria-label','DevPedia '+mode+' ERD');document.getElementById('original').href=diagram.data;document.getElementById('physical').setAttribute('aria-pressed',mode==='물리');document.getElementById('logical').setAttribute('aria-pressed',mode==='논리');fit()}window.addEventListener('resize',()=>{if(fitted)fit()});fit();</script></html>
