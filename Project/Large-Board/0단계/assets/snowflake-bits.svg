<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img" aria-label="Snowflake ID 64비트 구성" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><rect width="820" height="250" fill="#ffffff" rx="8"/><text x="410.0" y="26" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Snowflake ID 64비트 구성 (부호 1 + 시각 41 + 노드 10 + 순번 12)</text><rect x="30.0" y="70" width="22.0" height="54" fill="#9ca3af" rx="3" opacity="0.92"/><text x="41.0" y="100" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">0</text><text x="26" y="50" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">비트 63</text><rect x="52.0" y="70" width="486.9" height="54" fill="#2563eb" rx="3" opacity="0.92"/><text x="295.4375" y="93" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">시각 (ms, 기준 시각부터)</text><text x="295.4375" y="112" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">41비트</text><text x="54" y="62" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">비트 62</text><rect x="538.9" y="70" width="118.8" height="54" fill="#059669" rx="3" opacity="0.92"/><text x="598.25" y="93" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">노드 ID</text><text x="598.25" y="112" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">10비트</text><text x="540.875" y="62" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">비트 21</text><rect x="657.6" y="70" width="142.5" height="54" fill="#d97706" rx="3" opacity="0.92"/><text x="728.875" y="93" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">순번</text><text x="728.875" y="112" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">12비트</text><text x="659.625" y="62" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">비트 11</text><path d="M41.9,140 L41.9,148 L528.8,148 L528.8,140" fill="none" stroke="#6b7280"/><text x="285.3125" y="164" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">경과 시각 &lt;&lt; 22   (시각 − 2026-01-01T00:00:00Z)</text><path d="M530.8,140 L530.8,148 L647.5,148 L647.5,140" fill="none" stroke="#6b7280"/><text x="589.125" y="164" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">노드 &lt;&lt; 12</text><path d="M649.5,140 L649.5,148 L790.0,148 L790.0,140" fill="none" stroke="#6b7280"/><text x="719.75" y="164" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">순번 (&lt;&lt; 0)</text><text x="410.0" y="214" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal">조합: id = (경과 ms &lt;&lt; 22) | (노드 &lt;&lt; 12) | 순번   /   분해: 시각 = (id &gt;&gt;&gt; 22) + 기준 시각</text><text x="410.0" y="236" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">부호 비트가 항상 0이라 Java long, MySQL BIGINT(부호 있음)에서 양수로 정렬된다.</text></svg>